<oj-label for="barChart" style="font-size:1.2em; font-weight:600; margin-bottom:10px;">
  Spending by Category
</oj-label>

<oj-chart id="barChart" type="bar" orientation="vertical" stack="off" data="[[dataProvider]]"
  animation-on-display="auto" animation-on-data-change="auto" hover-behavior="dim">
  <template slot="itemTemplate" data-oj-as="item">
    <oj-chart-item value="[[item.data.value]]" group-id="[[ [item.data.group] ]]" series-id="[[item.data.series]]">
    </oj-chart-item>
  </template>
</oj-chart>
