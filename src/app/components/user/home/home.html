 <div class="dashboard-container">
  <app-user-navbar (menuChange)="onMenuChange($event)"></app-user-navbar>

    <app-bills *ngIf="selectedMenu === 'bills'"></app-bills>
    <app-userbank-account *ngIf="selectedMenu === 'bank'"></app-userbank-account>

</div>
