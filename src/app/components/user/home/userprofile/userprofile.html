<div class="profile-container">
  <h2>User Profile</h2>

  <!-- Profile Update Form -->
  <form (ngSubmit)="updateProfile()">
    <label>Full Name:</label>
    <input type="text" [(ngModel)]="user.fullName" name="fullName" required />

    <label>Email:</label>
    <input type="email" [(ngModel)]="user.email" name="email" required />

    <label>Mobile:</label>
    <input type="text" [(ngModel)]="user.mobile" name="mobile" required />

    <button type="submit">Update Profile</button>
  </form>

  <hr />

  <!-- Static Password Change Section -->
  <div class="password-section">
    <h3>Change Password</h3>
    <label>New Password:</label>
    <input type="password" placeholder="Enter new password" disabled />

    <button disabled>Change Password (Coming Soon)</button>
  </div>
</div>
