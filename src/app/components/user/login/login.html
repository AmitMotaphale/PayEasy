<div class="container">
  <h2>User Login</h2>
  <div *ngIf="!otpSent && error" class="alert alert-danger">{{ error }}</div>
  <form *ngIf="!otpSent" (ngSubmit)="login($event)">
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" required class="form-control" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" type="password" required class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <div *ngIf="otpSent">
    <h3>Enter OTP sent to your email</h3>
    <div *ngIf="otpError" class="alert alert-danger">{{ otpError }}</div>
    <div class="form-group">
      <input [(ngModel)]="otp" name="otp" maxlength="6" minlength="6" required class="form-control" placeholder="6-digit OTP" />
    </div>
    <button class="btn btn-success" (click)="verifyOtp()">Verify OTP</button>
  </div>
  <p class="mt-2">
    New to PayEasy? <a routerLink="/user/signup">Create an account</a>
  </p>
</div>
