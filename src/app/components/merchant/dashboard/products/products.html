<div class="product-container">
  <h2 class="section-title">🛒 Merchant Product Management</h2>

  <form
    (ngSubmit)="editProductId ? saveEdit() : addProduct()"
    #productForm="ngForm"
    class="product-form card"
  >
    <div class="form-group">
      <label>Product Name</label>
      <input
        [(ngModel)]="newProduct.productName"
        name="productName"
        required
        maxlength="100"
        placeholder="Enter product name"
      />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea
        [(ngModel)]="newProduct.description"
        name="description"
        maxlength="500"
        placeholder="Enter product description"
      ></textarea>
    </div>
    <div class="form-group">
      <label>Price (₹)</label>
      <input
        type="number"
        [(ngModel)]="newProduct.price"
        name="price"
        required
        min="0.01"
        step="0.01"
        placeholder="0.00"
      />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="productForm.invalid">
        {{ editProductId ? '💾 Save Changes' : '➕ Add Product' }}
      </button>
      <button *ngIf="editProductId" type="button" (click)="cancelEdit()" class="btn-cancel">
        ❌ Cancel
      </button>
    </div>
  </form>

  <div class="card table-wrapper" *ngIf="products.length > 0">
    <h3 class="table-title">📦 Your Added Products</h3>
    <table class="product-table">
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Description</th>
          <th>Price (₹)</th>
          <th>Manage</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.productName }}</td>
          <td>{{ product.description }}</td>
          <td>{{ product.price | number: '1.2-2' }}</td>
          <td>
            <button class="btn-edit" (click)="startEdit(product)">✏️ Edit</button>
            <button class="btn-delete" (click)="deleteProduct(product.productId!)">🗑️ Remove</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <p *ngIf="products.length === 0" class="no-products">
    You haven’t added any products yet. Start by adding your first product above!
  </p>
</div>
