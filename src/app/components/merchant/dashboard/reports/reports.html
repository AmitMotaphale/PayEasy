<div class="reports-container">
  <!-- Welcome Banner -->
  <div class="welcome-banner">
    <h2>Welcome back, {{merchantName}} 👋</h2>
    <p>Here’s your business at a glance</p>
  </div>

  <!-- Stats Cards -->
 <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Products</h3>
      <p class="stat-value">{{ totalProducts }}</p>
    </div>
    <div class="stat-card">
      <h3>Total Revenue</h3>
      <p class="stat-value">₹ {{ totalRevenue }}</p>
    </div>
    <div class="stat-card">
      <h3>Total Transactions</h3>
      <p class="stat-value">{{ totalTransactions }}</p>
    </div>
  </div>

  <!-- Graph Section -->
  <h3 class="section-title">Analytics</h3>
  <div class="graphs-grid">
    <div class="graph-card">📈 Sales over time</div>
    <div class="graph-card">💰 Revenue Breakdown</div>
    <div class="graph-card">⭐ Top Products</div>
    <div class="graph-card">📊 Monthly Transactions</div>
  </div>

  <!-- Transaction History -->
  <h3 class="section-title">Recent Transactions</h3>
  <div class="transactions-wrapper">
  <app-transactions></app-transactions>
</div>
</div>
