<div class="merchant-container">
  <!-- Top Bar with Search and Cart -->
  <div class="top-bar">
    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchTerm"
    />
    <button class="cart-btn" (click)="toggleCart()">
      🛒 Cart ({{ cartItems.length }})
    </button>
  </div>

  <!-- Cart Dropdown -->
  <div class="cart-box" *ngIf="showCart">
    <h4>Cart</h4>
    <div *ngIf="cartItems.length === 0">No items in cart</div>
    <div style="max-height: 250px; overflow-y: auto;">
    <div *ngFor="let item of cartItems" class="cart-item">
      <img [src]="item.image" alt="{{ item.name }}" />
      <div class="info">
        <h5>{{ item.name }}</h5>
        <p>₹ {{ item.price.toFixed(2) }}</p>
        <div class="quantity-controls">
          <button (click)="decreaseQuantity(item.id)">−</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increaseQuantity(item.id)">+</button>
          <button class="delete" (click)="removeFromCart(item.id)">🗑️</button>
        </div>
      </div>
    </div>
    </div>

    <div class="cart-total" *ngIf="cartItems.length">
      <strong>Total: ₹{{ totalPrice.toFixed(2) }}</strong>
      <button (click)="checkout()">Checkout</button>
    </div>
  </div>

  <!-- Product Cards -->
  <div class="product-grid">
    <div class="product-card" *ngFor="let product of filteredProducts; trackBy: trackById">
      <img [src]="product.image" alt="{{ product.name }}" />
      <h3>{{ product.name }}</h3>
      <p>{{ product.description }}</p>
      <p class="price">₹ {{ product.price.toFixed(2) }}</p>
      <div class="card-actions">
        <button (click)="addToCart(product)">Add to Cart</button>
        <button (click)="buyNow(product)">Buy Now</button>
      </div>
    </div>
  </div>
</div>
