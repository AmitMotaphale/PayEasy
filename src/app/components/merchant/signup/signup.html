<div class="container">
  <h2>Merchant Signup</h2>
  <form (ngSubmit)="signup()">
    <div class="form-group">
      <label>Merchant Name</label>
      <input [(ngModel)]="merchantName" name="merchantName" required class="form-control" />
    </div>
    <div class="form-group">
      <label>Contact Number</label>
      <input [(ngModel)]="contactNumber" name="contactNumber" required class="form-control" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" required class="form-control" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" type="password" required class="form-control" />
    </div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <button class="btn btn-success">Sign Up</button>
  </form>
  <p class="mt-2">
    Existing merchant? <a routerLink="/merchant/login">Login here</a>
  </p>
</div>
