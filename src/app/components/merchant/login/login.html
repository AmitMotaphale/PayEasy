<div class="container">
  <h2>Merchant Login</h2>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <form (ngSubmit)="login($event)">
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" required class="form-control" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" type="password" required class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p class="mt-2">
    New to PayEasy? <a routerLink="/merchant/signup">Create an account</a>
  </p>
</div>
