<div class="account-container">
  <h2>Bank Accounts</h2>

  <button class="add-btn" (click)="openForm()">➕ Add New Account</button>

  <!-- Bank Account List -->
  <div class="account-list" *ngIf="accounts.length > 0; else noAccounts">
    <div class="account-card" *ngFor="let account of accounts">
      <h3>{{ account.bankName }}</h3>
      <p><strong>Account Number:</strong> {{ account.accountNumber }}</p>
      <p><strong>Type:</strong> {{ account.accountType }}</p>
      <p><strong>Balance:</strong> ₹{{ account.balance }}</p>
      <p><strong>Status:</strong> {{ account.isPrimary ? 'Primary' : 'Secondary' }}</p>

      <div class="btn-group">
        <button (click)="openForm(account)">✏️ Edit</button>
        <button (click)="deleteAccount(account.id!)">🗑️ Delete</button>
        <button [disabled]="account.isPrimary" (click)="setPrimary(account.id!)">
          🌟 Set as Primary
        </button>
      </div>
    </div>
  </div>

  <ng-template #noAccounts>
    <p>No bank accounts added yet.</p>
  </ng-template>

  <!-- Account Form -->
  <div class="form-container" *ngIf="showForm">
    <h3>{{ selectedAccount ? 'Edit Account' : 'Add New Account' }}</h3>
    <form [formGroup]="accountForm" (ngSubmit)="saveAccount()">
      <label>
        Account Number:
        <input type="text" formControlName="accountNumber" />
      </label>

      <label>
        Account Type:
        <select formControlName="accountType">
          <option value="" disabled>Select Type</option>
          <option value="SAVINGS">Savings</option>
          <option value="CURRENT">Current</option>
        </select>
      </label>

      <label>
        Balance:
        <input type="number" formControlName="balance" />
      </label>

      <label>
        Bank Name:
        <input type="text" formControlName="bankName" />
      </label>

      <div class="form-actions">
        <button type="submit" [disabled]="accountForm.invalid">💾 Save</button>
        <button type="button" (click)="closeForm()">❌ Cancel</button>
      </div>
    </form>
  </div>
</div>
