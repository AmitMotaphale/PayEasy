
<div class="signup">
  <h2>Signup</h2>
  <form (ngSubmit)="onSignup()" #signupForm="ngForm">
    <label>User Type:</label>
    <select [(ngModel)]="userType" name="userType" required>
      <option value="user">User</option>
      <option value="business">Business</option>
    </select>
    <br>
    <input type="text" [(ngModel)]="name" name="name" required placeholder="Full Name">
    <br>
    <input type="email" [(ngModel)]="email" name="email" required placeholder="Email">
    <br>
    <input type="password" [(ngModel)]="password" name="password" required placeholder="Password">
    <br>
    <button type="submit">Signup</button>
  </form>
</div>
