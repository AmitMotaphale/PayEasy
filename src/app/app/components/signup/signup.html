<div class="container">
  <h2>Signup</h2>
  <form (ngSubmit)="signup()">
    <div class="form-group">
      <label>Full Name</label>
      <input [(ngModel)]="fullName" name="fullname" required class="form-control">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" required class="form-control">
    </div>
    <div class="form-group">
      <label>Mobile</label>
      <input [(ngModel)]="mobile" name="mobile" type="number" required class="form-control">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="passwordHash" name="password" type="password" required class="form-control">
    </div>
    <div class="form-group">
      <label>Account Type</label>
      <select [(ngModel)]="userType" name="userType" class="form-control">
        <option value="user">User</option>
        <option value="business">Business</option>
      </select>
    </div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <button class="btn btn-success">Sign Up</button>
  </form>
</div>
