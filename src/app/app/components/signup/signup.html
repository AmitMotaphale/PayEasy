<div class="container">
  <h2>Signup</h2>
  <form (ngSubmit)="signup()">
    <div class="form-group">
      <label>Username</label>
      <input [(ngModel)]="email" name="username" required class="form-control">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" type="password" required class="form-control">
    </div>

    <div class="form-group">
      <label>Account Type</label>
      <select [(ngModel)]="userType" name="userType" class="form-control">
        <option value="user">User</option>
        <option value="business">Business</option>
      </select>
    </div>

    <button class="btn btn-success">Sign Up</button>
  </form>
</div>
