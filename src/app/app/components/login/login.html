<div class="container">
  <h2>Login</h2>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <form (ngSubmit)="login()">
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" required class="form-control">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" required type="password" class="form-control">
    </div>

    <div class="form-group">
      <label>Account Type</label>
      <select [(ngModel)]="userType" name="userType" class="form-control">
        <option value="user">User</option>
        <option value="business">Business</option>
      </select>
    </div>

    <button class="btn btn-primary">Login</button>
  </form>
</div>
